# Despliegue en 3 EC2 de AWS Academy. Cada máquina levanta solo su "perfil":
#   EC2-1:  bash up.sh host1    -> etcd1, meta1, dn1
#   EC2-2:  bash up.sh host2    -> etcd2, meta2, dn2
#   EC2-3:  bash up.sh host3    -> etcd3, dn3, dn4
# Se usa la red del host (network_mode: host): cada servicio escucha en la IP privada
# de su EC2. Las IPs están en ../.env (IP1, IP2, IP3), igual en las 3 máquinas.
x-etcd: &etcd
  image: quay.io/coreos/etcd:v3.5.17
  network_mode: host
  restart: unless-stopped
  command: [/usr/local/bin/etcd]
  volumes: ["../certs:/certs:ro", "etcd:/data"]

x-etcd-env: &etcd_env
  ETCD_DATA_DIR: /data
  ETCD_CERT_FILE: /certs/node.crt
  ETCD_KEY_FILE: /certs/node.key
  ETCD_TRUSTED_CA_FILE: /certs/ca.crt
  ETCD_CLIENT_CERT_AUTH: "true"
  ETCD_PEER_CERT_FILE: /certs/node.crt
  ETCD_PEER_KEY_FILE: /certs/node.key
  ETCD_PEER_TRUSTED_CA_FILE: /certs/ca.crt
  ETCD_PEER_CLIENT_CERT_AUTH: "true"
  ETCD_INITIAL_CLUSTER: etcd1=https://${IP1}:2380,etcd2=https://${IP2}:2380,etcd3=https://${IP3}:2380
  ETCD_INITIAL_CLUSTER_STATE: new
  ETCD_LISTEN_CLIENT_URLS: https://0.0.0.0:2379
  ETCD_LISTEN_PEER_URLS: https://0.0.0.0:2380

x-app: &app
  build: {context: ../.., dockerfile: deploy/Dockerfile}
  image: dfsha:latest
  network_mode: host
  env_file: ../.env
  volumes: ["../certs:/certs:ro"]
  restart: unless-stopped
  environment: &appenv
    DFS_CA: /certs/ca.crt
    DFS_CERT: /certs/node.crt
    DFS_KEY: /certs/node.key
    DFS_ETCD: https://${IP1}:2379,https://${IP2}:2379,https://${IP3}:2379
    DFS_META: https://${IP1}:8001,https://${IP2}:8001

x-meta-cmd: &meta_cmd uvicorn control.meta:app --host 0.0.0.0 --port 8001 --ssl-keyfile /certs/node.key --ssl-certfile /certs/node.crt

services:
  etcd1:
    <<: *etcd
    profiles: [host1]
    container_name: dfs-etcd1
    environment:
      <<: *etcd_env
      ETCD_NAME: etcd1
      ETCD_ADVERTISE_CLIENT_URLS: https://${IP1}:2379
      ETCD_INITIAL_ADVERTISE_PEER_URLS: https://${IP1}:2380
  meta1:
    <<: *app
    profiles: [host1]
    container_name: dfs-meta1
    command: *meta_cmd
    environment: {<<: *appenv, DFS_META_ID: meta1}
  dn1:
    <<: *app
    profiles: [host1]
    container_name: dfs-dn1
    command: uvicorn datanode.datanode:app --host 0.0.0.0 --port 9001 --ssl-keyfile /certs/node.key --ssl-certfile /certs/node.crt
    environment: {<<: *appenv, DFS_NODE_ID: dn1, DFS_NODE_URL: "https://${IP1}:9001", DFS_DATA_DIR: /data}
    volumes: ["../certs:/certs:ro", "dn1:/data"]

  etcd2:
    <<: *etcd
    profiles: [host2]
    container_name: dfs-etcd2
    environment:
      <<: *etcd_env
      ETCD_NAME: etcd2
      ETCD_ADVERTISE_CLIENT_URLS: https://${IP2}:2379
      ETCD_INITIAL_ADVERTISE_PEER_URLS: https://${IP2}:2380
  meta2:
    <<: *app
    profiles: [host2]
    container_name: dfs-meta2
    command: *meta_cmd
    environment: {<<: *appenv, DFS_META_ID: meta2}
  dn2:
    <<: *app
    profiles: [host2]
    container_name: dfs-dn2
    command: uvicorn datanode.datanode:app --host 0.0.0.0 --port 9001 --ssl-keyfile /certs/node.key --ssl-certfile /certs/node.crt
    environment: {<<: *appenv, DFS_NODE_ID: dn2, DFS_NODE_URL: "https://${IP2}:9001", DFS_DATA_DIR: /data}
    volumes: ["../certs:/certs:ro", "dn2:/data"]

  etcd3:
    <<: *etcd
    profiles: [host3]
    container_name: dfs-etcd3
    environment:
      <<: *etcd_env
      ETCD_NAME: etcd3
      ETCD_ADVERTISE_CLIENT_URLS: https://${IP3}:2379
      ETCD_INITIAL_ADVERTISE_PEER_URLS: https://${IP3}:2380
  dn3:
    <<: *app
    profiles: [host3]
    container_name: dfs-dn3
    command: uvicorn datanode.datanode:app --host 0.0.0.0 --port 9001 --ssl-keyfile /certs/node.key --ssl-certfile /certs/node.crt
    environment: {<<: *appenv, DFS_NODE_ID: dn3, DFS_NODE_URL: "https://${IP3}:9001", DFS_DATA_DIR: /data}
    volumes: ["../certs:/certs:ro", "dn3:/data"]
  dn4:
    <<: *app
    profiles: [host3]
    container_name: dfs-dn4
    command: uvicorn datanode.datanode:app --host 0.0.0.0 --port 9002 --ssl-keyfile /certs/node.key --ssl-certfile /certs/node.crt
    environment: {<<: *appenv, DFS_NODE_ID: dn4, DFS_NODE_URL: "https://${IP3}:9002", DFS_DATA_DIR: /data}
    volumes: ["../certs:/certs:ro", "dn4:/data"]

  # Cliente (en cualquier EC2): bash dfs.sh login miguel
  client:
    <<: *app
    profiles: [client]
    restart: "no"
    command: python src/client/dfs.py --help
    environment: {<<: *appenv, DFS_SESSION: /tmp/session.json, DFS_TEST_TMP: /tmp}

volumes: {etcd: {}, dn1: {}, dn2: {}, dn3: {}, dn4: {}}
